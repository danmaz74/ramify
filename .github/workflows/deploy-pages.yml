# Builds the documentation site and publishes it to GitHub Pages at
# https://danmaz74.github.io/ramify/. Local builds keep baseUrl '/'; only
# this workflow sets BASE_URL to the project-page subpath.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The site bundles ../src directly, so both packages need their deps.
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          BASE_URL: /ramify/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
