name: Resident macOS focused acceptance

on:
  push:
    branches: [validation/resident-macos-20260911]

permissions:
  contents: read

jobs:
  focused-acceptance:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run worktree:prepare
      - run: npm run build
      - name: Verify corrected lookup instrumentation
        run: npm test -- subs/analysis/subs/model/src/tests/decision-lookups.test.ts
      - name: Restore immutable original evidence
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          archive=pathlib.Path('docs/plans/iteration-2-resident-verification/evidence/macos-remediation-baseline-34610976201.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='1eb7393661dcc12e6822826c7c980d29ea94832bfd41f21eba1fc621bb1fd9a1'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if name.startswith('.reference-work/'):
                      z.extract(name)
          PY
          cp docs/plans/iteration-2-resident-verification/evidence/plan1-reuse-review.json .reference-work/reports/
      - name: Run nine affected Plan 1 cases
        run: node --import tsx scripts/reference-harness/plan1-focused.ts .reference-work/reports/plan1-focused-macos.json
      - name: Validate composed Plan 1 acceptance
        run: >-
          node --import tsx scripts/reference-harness/completion-composition.ts
          .reference-work/reports
          plan1-full-83505f4b-1a63-4f8d-bffa-aff6f49e04c4.json
          plan1-focused-macos.json
          plan1-reuse-review.json
          plan1-composed-macos-20260911.json
      - name: Run three affected resident process cases
        shell: bash
        run: |
          cat > .reference-work/macos-focused.mts <<'SCRIPT'
          import assert from 'node:assert/strict';
          import { mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { spawn } from 'node:child_process';
          import { resolve } from 'node:path';
          import { release } from 'node:os';
          import { plan2Instances } from '../scripts/reference-harness/plan2-instances.js';
          import { plan2Runtime } from '../scripts/reference-harness/plan2-runtime.js';
          import { readReviewedPlan2, repositoryRoot, validateInstancePointers } from '../scripts/reference-harness/plan.js';
          import { verifyInstances } from '../scripts/reference-harness/runner.js';
          import { executionIdentity } from '../scripts/reference-harness/artifact.js';
          import { evidenceRoots, portableValue } from '../scripts/reference-harness/portability.js';
          assert.equal(process.platform, 'darwin');
          const selectedIds = ['I2-30:self-check-eleven', 'I2-30:self-negative-contexts', 'I2-30:plan1-regression'];
          const ids = new Set(selectedIds), plan = readReviewedPlan2();
          const members = plan.members.filter(member => ids.has(member[0]));
          const records = plan2Instances.filter(record => ids.has(record.id));
          assert.equal(members.length, 3); assert.deepEqual(validateInstancePointers(records), []);
          const endpoint = await mkdtemp('/tmp/rmf-');
          process.env.RAMIFY_ENDPOINT_DIR = endpoint;
          const command = (args: string[]) => new Promise<any>((resolveRun, reject) => {
            const child = spawn(process.execPath, ['dist/src/cli-entry.js', ...args], { cwd: repositoryRoot, env: process.env, stdio: ['ignore', 'pipe', 'pipe'] });
            let stdout = '', stderr = '';
            child.stdout.on('data', value => stdout += value); child.stderr.on('data', value => stderr += value);
            child.once('error', reject); child.once('close', code => resolveRun({ code, stdout, stderr }));
          });
          const identity = await executionIdentity(), startedAt = new Date().toISOString(), started = performance.now();
          let result, stop, status;
          try {
            result = await verifyInstances({ plan: { ...plan, members }, records, runtime: plan2Runtime,
              workRoot: resolve(repositoryRoot, 'examples/collection-review/.reference-work'), preserveOnFailure: true });
          } finally {
            stop = await command(['daemon', 'stop']); status = await command(['daemon', 'status', '--format', 'json']);
            if (stop.code === 0) await rm(endpoint, { recursive: true, force: true });
          }
          const after = await executionIdentity();
          assert.equal(after.sourceSha256, identity.sourceSha256); assert.equal(after.buildSha256, identity.buildSha256);
          const artifact = portableValue({ ...result, planComplete: false, cleanup: { stop, status }, evidence: {
            kind: 'macos-focused-process-acceptance', platform: process.platform, architecture: process.arch,
            osRelease: release(), identity, startedAt, completedAt: new Date().toISOString(), durationMs: performance.now() - started,
            selectedIds, scope: 'Three affected cases; 75 unchanged executions remain in original run 34610976201.' } }, await evidenceRoots());
          await writeFile('.reference-work/macos-focused.json', JSON.stringify(artifact) + '\n');
          console.log(JSON.stringify({ passed: result?.passed, summary: result?.summary, failures: result?.instances.filter(x => x.status !== 'passed'), cleanup: { stop, status } }));
          assert.equal(stop.code, 0); assert.equal(status.code, 0); assert.equal(JSON.parse(status.stdout).running, false);
          assert.equal(result?.passed, true);
          SCRIPT
          node --import tsx .reference-work/macos-focused.mts
      - name: Preserve focused results and all raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-macos-focused-evidence
          path: |
            .reference-work/reports/**
            .reference-work/evidence/**
            .reference-work/macos-focused.json
          include-hidden-files: true
          retention-days: 14
