    if (dense) { const buckets = Math.max(20, Math.floor(plotW / 6)); const counts = new Array(buckets).fill(0); ss.forEach(s => s.invocations.forEach(i => { const a = Math.floor((i.from / end) * buckets), b = Math.min(buckets - 1, Math.floor(((i.to ?? end) / end) * buckets)); for (let k = a; k <= b; k++) counts[k]++; })); const mx = Math.max(1, ...counts); const h = mini ? 12 : 34;
      add(`${mini ? ROLE_LABEL[role].replace('initial architect', 'initial arch.').replace('local architect', 'local arch.').replace('contract engineer', 'contract eng.') : ROLE_LABEL[role]} (${ss.length})`, h, (yy, hh) => counts.map((c, k) => { const t0 = (k / buckets) * end, t1 = ((k + 1) / buckets) * end; const bh = (c / mx) * (hh - 2); return c ? `<rect x="${X(t0)}" y="${yy + hh - bh}" width="${Math.max(1, X(t1) - X(t0) - 1)}" height="${bh}" fill="${roleVar(role)}" opacity="0.8"><title>${ROLE_LABEL[role]}: ${c} live at ${clock(run, t0)}</title></rect>` : ''; }).join('') + (sel ? ss.filter(s => rel.has(`session:${s.id}`) || `${sel.kind}:${sel.id}` === `session:${s.id}`).map(s => s.invocations.map(i => `<rect x="${X(i.from)}" y="${yy - 1}" width="${Math.max(2, X(i.to ?? end) - X(i.from))}" height="${hh + 2}" fill="none" stroke="var(--now)" stroke-width="2"/>`).join('')).join('') : ''), 'sessions'); }
    else ss.forEach(s => add(`${s.id}${s.workItem ? ' · ' + s.workItem : ''}`, LH, (yy, h) => { const key = `session:${s.id}`; let out = `<g ${dimOf(key)}>`; for (let k = 0; k < s.invocations.length - 1; k++) out += `<line x1="${X(s.invocations[k].to)}" x2="${X(s.invocations[k + 1].from)}" y1="${yy + h / 2}" y2="${yy + h / 2}" stroke="var(--axis)" stroke-dasharray="3 3"/>`; if (s.state === 'suspended' && s.invocations.slice(-1)[0].to != null) out += `<line x1="${X(s.invocations.slice(-1)[0].to)}" x2="${X(end)}" y1="${yy + h / 2}" y2="${yy + h / 2}" stroke="var(--warn)" stroke-dasharray="3 3"/>`; s.invocations.forEach(i => { const w = Math.max(3, X(i.to ?? end) - X(i.from)); out += `<g class="seg node" data-sel="${key}"><rect x="${X(i.from)}" y="${yy + 2}" width="${w}" height="${h - 4}" rx="3" fill="${roleVar(role)}" ${i.to == null ? 'stroke="var(--now)" stroke-width="2" stroke-dasharray="4 2"' : ''}/>${w > 44 ? `<text x="${X(i.from) + 4}" y="${yy + h * 0.68}" font-size="9.5" fill="#0b0b0b" class="svgmono">${i.id}</text>` : ''}<title>${i.id} ${ROLE_LABEL[role]} ${i.to == null ? 'live' : dur(i.to - i.from)}</title></g>`; }); return out + '</g>'; }, 'sessions', role)); });
  const H = y + (mini ? 14 : 20);
  let svg = `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Timeline">`;
  // grid, axis
  const ticks = mini ? 6 : 12; for (let k = 0; k <= ticks; k++) { const t = (end / ticks) * k; svg += `<line class="grid-line" x1="${X(t)}" x2="${X(t)}" y1="${mini ? 0 : 22}" y2="${H - 16}"/><text x="${X(t)}" y="${H - 4}" font-size="9" text-anchor="middle" fill="var(--muted)">${clock(run, t).slice(0, 5)}</text>`; }
  idle.forEach(([a, b]) => { const x = X(a + 1) ; svg += `<rect x="${x - CUT / 2 + 2}" y="${mini ? 0 : 22}" width="${CUT - 4}" height="${H - 38}" fill="var(--paper)"/><path d="M${x - 3} ${mini ? 0 : 22} q3 6 0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12 t0 12" fill="none" stroke="var(--axis)"/><text x="${x}" y="${H - 20}" font-size="8" text-anchor="middle" fill="var(--muted)">${dur(b - a)} idle</text>`; });
  lanes.forEach((l, i) => { if (!mini && i % 2) svg += `<rect class="lane-band" x="${left}" y="${l.y - 1}" width="${plotW}" height="${l.h + 2}"/>`; svg += `<text class="lane-label" x="${left - 6}" y="${l.y + l.h * 0.68}" text-anchor="end" font-size="${mini ? 8 : 11}">${esc(l.label.length > 22 ? l.label.slice(0, 21) + '…' : l.label)}</text>`; if (l.group === 'sessions' && !mini && lanes[i - 1] && lanes[i - 1].group !== 'sessions') svg += ''; svg += l.draw(l.y, l.h); });
  if (run.state === 'running') svg += `<line x1="${X(run.now)}" x2="${X(run.now)}" y1="${mini ? 0 : 18}" y2="${H - 14}" stroke="var(--now)" stroke-width="2"/><text x="${X(run.now) - 4}" y="${mini ? 8 : 14}" font-size="${mini ? 8 : 10}" text-anchor="end" fill="var(--now)" font-weight="600">now</text>`;
  svg += '</svg>';
  return svg;
}
function renderTimeline(run) {
  const rel = relatedSet(run, state.sel);
  const roleGroups = Object.keys(ROLES).map(r => ({ r, n: run.sessions.filter(s => s.role === r).length })).filter(x => x.n);
  $('#main').innerHTML = `<div class="split"><div class="tl-wrap"><div class="tl-tools"><span>Axis: real time, idle stretches longer than 2 minutes folded (toggle <span class="kbd">raw</span>)</span><span>·</span><span>window: whole run (drag the brush in the design; static here)</span><span>·</span><span>groups: run, work items, sessions by role${run.sessions.length > 12 ? ' (density lanes above 12 sessions per role; expand a role to see its lanes)' : ''}</span></div><div id="tl"></div><div class="legend" style="margin-top:.4rem"><span>phases</span><span><i class="sw" style="background:var(--good)"></i>gate passed</span><span><i class="sw" style="background:var(--bad)"></i>gate failed</span><span><i class="sw" style="background:var(--now)"></i>running / open</span><span><i class="sw hollow" style="border-style:dashed"></i>readiness start inferred</span>${roleGroups.map(g => `<span><i class="sw" style="background:${roleVar(g.r)}"></i>${ROLE_LABEL[g.r]} (${g.n})</span>`).join('')}<span><i class="glyph attention"></i> attention</span><span><i class="glyph caution"></i> caution</span><span><i class="glyph info"></i> info</span></div></div><div><div class="card layer"><h3>Context <span class="sub">the selection's related elements; opens the map</span></h3>${state.sel ? `<div class="row">${[...rel].slice(0, 24).map(k => { const i = k.indexOf(':'); const kind = k.slice(0, i), id = k.slice(i + 1); return kind === 'invocation' || kind === 'iteration' ? `<span class="mono sub">${id}</span>` : `<span class="link mono" data-sel="${k}">${id}</span>`; }).join(' ')}</div>` : '<div class="sub">Nothing selected.</div>'}</div>${detailPanel(run, rel, state.sel)}</div></div>`;
  $('#tl').innerHTML = timelineSvg(run, { width: Math.max(700, $('#tl').clientWidth || 900), rel, sel: state.sel });
  wireSel(); $('#main').querySelectorAll('[data-clear]').forEach(el => el.addEventListener('click', () => navigate({ sel: null })));
}

// ---------------------------------------------------------------------------
// Lists and pages (level 2 and 3), sketched
// ---------------------------------------------------------------------------
function renderLists(run) {
  const w = run.workItems[0]; const g = run.gates.find(x => x.subject.workItem === w.id) || run.gates[0];
  $('#main').innerHTML = `<div class="grid">
    <div class="card c12"><h2>Level 2: lists</h2><div class="row">${['work', 'scenarios', 'gates', 'sessions', 'capabilities', 'modules', 'decisions', 'issues', 'events', 'measurements', 'analysis'].map(l => `<span class="kbd mono">#/plans/${run.plan}/runs/…/${l}</span>`).join('')}</div><p class="sub">Each list: state-count filter chips carried in the URL (<code>?state=</code>), sortable columns that never wrap mid-word, "showing N of total" on bounded answers, and every id a link to its page. The former Overview panels become the Issues, Events and Analysis lists.</p></div>
    <div class="card c6"><h2>Level 3: work item page</h2><div class="sub mono">#/plans/${run.plan}/runs/${run.id}/work/${w.id}</div><div class="crumbs" style="padding:0.3rem 0">Plans › ${esc(run.planTitle)} › Run › Work item <code>${w.id}</code></div><dl class="kv detail" style="position:static"><dt>state</dt><dd>${w.state}</dd><dt>capability</dt><dd><span class="link mono">${w.capability}</span></dd><dt>module</dt><dd><span class="link mono">${esc(w.module)}</span></dd><dt>origin</dt><dd>${w.origin}</dd><dt>iterations</dt><dd>${w.iterations.map(i => `<b>${i.id}</b> ${i.kind}, ${i.outcome}; gates ${i.gates.map(x => `<span class="link mono">${x}</span>`).join(', ')}; chapters ${i.invocations.map(x => `<span class="link mono">${x}</span>`).join(', ')}`).join('<br>') || 'none yet'}</dd><dt>work-item gates</dt><dd>${w.gates.map(x => `<span class="link mono">${x}</span>`).join(', ') || 'none yet'}</dd></dl><h4 style="font-size:.72rem;text-transform:uppercase;color:var(--muted);margin:.6rem 0 .2rem">Where in time</h4><div id="wit"></div><h4 style="font-size:.72rem;text-transform:uppercase;color:var(--muted);margin:.6rem 0 .2rem">Related</h4><div class="sub">scenarios ${run.scenarios.filter(s => s.workItem === w.id).map(s => `<span class="link mono">${s.id}</span>`).join(', ') || 'none'} · sessions ${run.sessions.filter(s => s.workItem === w.id).map(s => `<span class="link mono">${s.id}</span>`).join(', ') || 'none'}</div></div>
    <div class="card c6"><h2>Level 3: gate page</h2><div class="sub mono">#/plans/${run.plan}/runs/${run.id}/gates/${g.id}</div><dl class="kv detail" style="position:static"><dt>checkpoint</dt><dd>${g.checkpoint}</dd><dt>subject</dt><dd><span class="link mono">${g.subject.iteration || g.subject.workItem || 'the run'}</span></dd><dt>verdict</dt><dd><i class="sw" style="background:${stateColor(g.verdict)}"></i>${g.verdict}, next accept</dd><dt>duration</dt><dd>${g.to != null ? dur(g.to - g.from) : 'running'}</dd><dt>commands</dt><dd><b>tests</b> passed · exit 0 · 3.9 s <span class="note">(per-test results are not recorded; only the exit code is read)</span><br><b>type-check</b> passed · 2.1 s<br><b>ramify-check</b> passed · 1.4 s · <span class="link">full output (1.8 MB)</span> <span class="note">once served</span><br><b>scenarios</b> passed · quick · ${run.scenarios.filter(s => s.gates.some(([x]) => x === g.id)).map(s => `<span class="link mono">${s.id}</span> passed`).join(', ') || 'none selected'}</dd><dt>output tail</dt><dd><pre class="mono" style="margin:0;padding:.4rem;border:1px solid var(--line);border-radius:6px;font-size:.72rem;white-space:pre-wrap"> ✓ src/tests/status-badge.test.tsx (4 tests) 21ms\n Test Files  1 passed (1)\n      Tests  4 passed (4)</pre><span class="note">ANSI rendered as color, never as escape codes</span></dd></dl></div>
    <div class="card c6"><h2>Level 3: scenario page</h2><div class="sub mono">…/scenarios/${run.scenarios[0].id}</div><dl class="kv detail" style="position:static"><dt>name</dt><dd>${esc(run.scenarios[0].name)}</dd><dt>state</dt><dd>${run.scenarios[0].state}</dd><dt>history</dt><dd>${run.scenarios[0].declared != null ? `declared ${clock(run, run.scenarios[0].declared)} by <span class="link mono">inv-0003</span><br>implemented ${clock(run, run.scenarios[0].implemented)} by <span class="link mono">ga-0002</span>` : 'from events (declared, due, implemented, withdrawn)'}</dd><dt>entry</dt><dd><span class="link mono">${run.scenarios[0].entry || 'integration'}</span></dd><dt>gates</dt><dd>${run.scenarios[0].gates.map(([x, st]) => `<span class="link mono">${x}</span> ${st}`).join('<br>') || 'none yet'}</dd><dt>text</dt><dd><pre class="mono" style="margin:0;font-size:.72rem;white-space:pre-wrap">${run.invented ? `Scenario: ${esc(run.scenarios[0].name)}\n  (invented run: no frozen text)` : `Scenario: A badge given a tone carries that tone in its markup\n  Given a badge for a passed review with the tone "warning"\n  When the badge is rendered\n  Then its markup carries the tone "warning"\n  And it still reads "Passed"`}</pre></dd></dl></div>
    <div class="card c6"><h2>Level 3: capability page</h2><div class="sub mono">…/capabilities/${run.capabilities[0].id}</div><dl class="kv detail" style="position:static"><dt>state</dt><dd>${run.capabilities[0].state}: ${esc(run.capabilities[0].reason)}</dd><dt>kind</dt><dd>top-level (entry)</dd><dt>owner</dt><dd><span class="link mono">${esc(run.capabilities[0].owner)}</span></dd><dt>depends on</dt><dd>${run.capabilities[0].dependsOn.map(d => `<span class="link mono">${d}</span>`).join(', ') || 'nothing recorded'}</dd><dt>scenarios</dt><dd>${run.capabilities[0].scenarios.map(s => { const x = run.scenarios.find(y => y.id === s); return `<i class="sd ${x.state}" style="display:inline-block"></i> <span class="link mono">${s}</span>`; }).join(' ')}</dd><dt>work items</dt><dd>${run.capabilities[0].workItems.map(x => `<span class="link mono">${x}</span>`).join(', ')}</dd><dt>evidence</dt><dd>${run.capabilities[0].evidence.map(x => `<span class="link mono">${x}</span>`).join(', ') || 'none yet'}</dd></dl><p class="note">Level 4 stays as today: the transcript page (with a chapter table of contents and an entry-type filter added), the captured plan, output tails.</p></div>
  </div>`;
  $('#wit').innerHTML = timelineSvg(run, { mini: true, width: $('#wit').clientWidth || 500, rel: relatedSet(run, { kind: 'work-item', id: w.id }), sel: { kind: 'work-item', id: w.id } });
}

// ---------------------------------------------------------------------------
function render() { const run = RUNS[state.runKey]; renderFrame(run); ({ overview: renderOverview, map: renderMap, timeline: renderTimeline, lists: renderLists })[state.view](run); }
document.addEventListener('DOMContentLoaded', () => {
  parseHash(); render();
  $('#run-small').addEventListener('click', () => navigate({ runKey: 'small', sel: null }));
  $('#run-large').addEventListener('click', () => navigate({ runKey: 'large', sel: null }));
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => navigate({ view: t.dataset.view })));
  const themes = ['auto', 'light', 'dark']; let ti = 0;
  $('#theme').addEventListener('click', () => { ti = (ti + 1) % 3; const t = themes[ti]; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); $('#theme').textContent = 'Theme: ' + t; });
  window.addEventListener('hashchange', () => { parseHash(); render(); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
});
</script>
</body>
