<svg xmlns="http://www.w3.org/2000/svg" class="rmf" data-kind="tree-diagram" id="rmf-tree-shop-tree" width="940" height="230" viewBox="0 0 940 230" role="img" aria-label="A module tree for an online shop: shop at the root, then catalog, checkout, accounts and platform, each with its own sub-modules, down to four levels"><style>.rmf{--rmf-bg:#FFFFFF;--rmf-panel:#FFFFFF;--rmf-boxstroke:#94A3B8;--rmf-separator:#E2E8F0;--rmf-text:#0F172A;--rmf-muted:#94A3B8;--rmf-edge:#CBD5E1;--rmf-neutral:#475569;--rmf-traced1:#4C6EF5;--rmf-traced2:#C2255C;--rmf-traced3:#B45309;--rmf-traced4:#0F766E;--rmf-denial:#DC2626;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.rmf:not([data-theme="light"]){--rmf-bg:#0B1220;--rmf-panel:#131C2E;--rmf-boxstroke:#55617A;--rmf-separator:#2B3648;--rmf-text:#E2E8F0;--rmf-muted:#64748B;--rmf-edge:#3F4A5A;--rmf-neutral:#94A3B8;--rmf-traced1:#8DA2FB;--rmf-traced2:#F783AC;--rmf-traced3:#FBBF24;--rmf-traced4:#2DD4BF;--rmf-denial:#F87171}}
.rmf[data-theme="dark"]{--rmf-bg:#0B1220;--rmf-panel:#131C2E;--rmf-boxstroke:#55617A;--rmf-separator:#2B3648;--rmf-text:#E2E8F0;--rmf-muted:#64748B;--rmf-edge:#3F4A5A;--rmf-neutral:#94A3B8;--rmf-traced1:#8DA2FB;--rmf-traced2:#F783AC;--rmf-traced3:#FBBF24;--rmf-traced4:#2DD4BF;--rmf-denial:#F87171}
.rmf-s-bg{stroke:var(--rmf-bg)}.rmf-s-panel{stroke:var(--rmf-panel)}.rmf-s-boxstroke{stroke:var(--rmf-boxstroke)}.rmf-s-separator{stroke:var(--rmf-separator)}.rmf-s-text{stroke:var(--rmf-text)}.rmf-s-muted{stroke:var(--rmf-muted)}.rmf-s-edge{stroke:var(--rmf-edge)}.rmf-s-neutral{stroke:var(--rmf-neutral)}.rmf-s-traced1{stroke:var(--rmf-traced1)}.rmf-s-traced2{stroke:var(--rmf-traced2)}.rmf-s-traced3{stroke:var(--rmf-traced3)}.rmf-s-traced4{stroke:var(--rmf-traced4)}.rmf-s-denial{stroke:var(--rmf-denial)}
.rmf-f-bg{fill:var(--rmf-bg)}.rmf-f-panel{fill:var(--rmf-panel)}.rmf-f-boxstroke{fill:var(--rmf-boxstroke)}.rmf-f-separator{fill:var(--rmf-separator)}.rmf-f-text{fill:var(--rmf-text)}.rmf-f-muted{fill:var(--rmf-muted)}.rmf-f-edge{fill:var(--rmf-edge)}.rmf-f-neutral{fill:var(--rmf-neutral)}.rmf-f-traced1{fill:var(--rmf-traced1)}.rmf-f-traced2{fill:var(--rmf-traced2)}.rmf-f-traced3{fill:var(--rmf-traced3)}.rmf-f-traced4{fill:var(--rmf-traced4)}.rmf-f-denial{fill:var(--rmf-denial)}
.rmf .rmf-layer{transition:opacity 120ms ease-out}
.rmf .rmf-dim{opacity:0.12}
.rmf .rmf-dim-soft{opacity:0.4}
.rmf .rmf-clickable{cursor:pointer}
.rmf text{dominant-baseline:middle}
@keyframes rmf-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-12}}
.rmf .rmf-flow{stroke-dasharray:6 6;animation:rmf-march 0.9s linear infinite}
@keyframes rmf-pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.rmf .rmf-blink{animation:rmf-pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rmf .rmf-flow{animation:none}.rmf .rmf-blink{animation:none;opacity:1}}
.rmf .rmf-knockout{paint-order:stroke fill;stroke:var(--rmf-bg);stroke-width:4.2;stroke-linejoin:round}</style><rect data-kind="background" class="rmf-f-bg" x="0" y="0" width="940" height="230"></rect><path data-kind="edge" data-parent="shop" data-child="catalog" d="M490 38V55H154V72" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="catalog" data-child="search" d="M154 98V115H91V132" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="search" data-child="indexing" d="M91 158V175H50.5V192" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="search" data-child="ranking" d="M91 158V175H132V192" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="catalog" data-child="inventory" d="M154 98V115H217.5V132" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="shop" data-child="checkout" d="M490 38V55H415.5V72" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="checkout" data-child="cart" d="M415.5 98V115H296V132" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="checkout" data-child="payment" d="M415.5 98V115H401V132" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="payment" data-child="cards" d="M401 158V175H360V192" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="payment" data-child="fraudCheck" d="M401 158V175H442V192" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="checkout" data-child="shipping" d="M415.5 98V115H534.5V132" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" data-parent="shipping" data-child="routing" d="M534.5 158V175H535V192" fill="none" stroke-width="1.2" class="rmf-s-edge"></path><path data-kind="edge" d