abel" class="rmf-f-traced2" x="622" y="507" font-size="12" font-style="italic">InvoiceModel</text><text id="node-invoicePDF-receives-InvoiceModel-from" data-kind="node-row-from" class="rmf-f-muted" x="827" y="507" text-anchor="end" font-size="10">from invoicing</text></g></g></g></g><g id="rmf-layer-legend" data-kind="layer" data-layer="legend" class="rmf-layer"><g id="rmf-legend-node" data-kind="legend-group" data-group="node"><text id="rmf-legend-node-title" data-kind="legend-title" class="rmf-f-text" x="26" y="580.5" font-size="11" font-weight="700">Node</text><g id="rmf-legend-entry-to-parent" data-kind="legend-entry" data-selected="false"><rect data-kind="legend-hit" fill="transparent" x="26" y="590" width="174.6" height="16"></rect><text data-kind="legend-glyph" class="rmf-f-neutral" x="51" y="598" text-anchor="middle" font-size="11">▲</text><text data-kind="legend-text" class="rmf-f-text" x="76" y="598" font-size="10.5">exposed to parent</text></g><g id="rmf-legend-entry-to-descendants" data-kind="legend-entry" data-selected="false"><rect data-kind="legend-hit" fill="transparent" x="26" y="606" width="174.6" height="16"></rect><text data-kind="legend-glyph" class="rmf-f-neutral" x="51" y="614" text-anchor="middle" font-size="11">▼</text><text data-kind="legend-text" class="rmf-f-text" x="76" y="614" font-size="10.5">exposed to descendants</text></g></g><text id="rmf-legend-note-0" data-kind="legend-note" class="rmf-f-muted" x="26" y="638" font-size="10">InvoiceModel travels a chain of two decisions: up to invoicing, then down to its subtree.</text><text id="rmf-legend-note-1" data-kind="legend-note" class="rmf-f-muted" x="26" y="653" font-size="10">invoicing exposed it to its descendants only, so it never reaches app.</text><text id="rmf-legend-note-2" data-kind="legend-note" class="rmf-f-muted" x="26" y="668" font-size="10">Files inside one module import each other freely; those imports are not drawn.</text></g></svg>
